<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Syukuran Rotasi XXXVI</title>
<meta property="og:title" content="Undangan Syukuran Rotasi XXXVI">
<meta property="og:description" content="7 – 8 November 2026 · Pondok Uya, Pantai Anging Mamiri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#140700;--bg2:#3a1500;--or:#ff7a00;--or2:#ff9a2e;--cream:#ffe9d6;--line:rgba(255,154,46,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(255,190,120,.16) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,190,120,.16) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask-image:radial-gradient(ellipse 95% 75% at 50% 35%,#000 30%,rgba(0,0,0,.4) 100%);mask-image:radial-gradient(ellipse 95% 75% at 50% 35%,#000 30%,rgba(0,0,0,.4) 100%)}
body{margin:0;font:400 1rem/1.6 Poppins,system-ui,sans-serif;color:var(--cream);background:#060200;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,#060200 0%,#1b0800 35%,#6a2600 68%,#c85200 100%)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle 480px at var(--mx,50%) var(--my,26%),rgba(255,122,0,.38),transparent 70%),radial-gradient(circle 340px at 88% 62%,rgba(255,140,40,.22),transparent 70%),radial-gradient(circle 380px at 8% 88%,rgba(255,90,0,.2),transparent 70%)}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* hero */
.hero{position:relative;text-align:center;padding:60px 0 90px}
.hero .wrap{position:relative}
.logo{width:84px;height:84px;margin:0 auto 24px;border-radius:22px;background:linear-gradient(160deg,#ff9a2e,#d95a00);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font:800 .85rem Poppins;letter-spacing:.08em;color:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.tamu{display:inline-block;margin-bottom:8px;padding:7px 18px;border:1px solid var(--or2);border-radius:999px;font-size:.95rem}
.tamu b{color:#fff}

/* kartu judul interaktif */
.stage{position:relative;width:min(540px,100%);margin:44px auto 0;perspective:900px}
.frame{position:relative;transform:rotate(-2deg) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shot{padding:12px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 30px 60px -20px #000,0 0 90px rgba(255,122,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.pw{position:relative}
.photo{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#4a1a00,#1a0a02);border:1px solid rgba(255,255,255,.25)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#ffb86b;font-size:.9rem}
.cap{margin:12px 0 0;padding:16px 22px;border-radius:20px;background:#fff3e3;font:400 clamp(1.4rem,6vw,2.2rem)/1.1 "Archivo Black",sans-serif;color:#d95a00}
.cap img{display:block;width:72%;max-width:100%;height:auto;margin:0 auto}
.bub{position:absolute;font:800 .95rem/1.15 Poppins;text-transform:uppercase;text-align:left;padding:15px 20px;border-radius:26px;box-shadow:0 12px 24px -10px #000;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}
.bub.w{background:#fff;color:var(--or);left:-22px;top:-28px;border-bottom-left-radius:4px;font-size:1.05rem}
.bub.o{background:var(--or);color:#fff;right:-22px;bottom:-26px;border-bottom-right-radius:4px;max-width:70%;animation-delay:.35s}
.bub small{display:block;margin-top:4px;font:600 .72rem Poppins;opacity:.95}
@media(max-width:420px){.bub{padding:12px 15px}.bub.w{font-size:.9rem;left:-8px}.bub.o{right:-8px}}
@keyframes pop{from{transform:scale(.4) translateY(20px);opacity:0}}
.hint{margin:56px 0 0;font-size:.85rem;color:#ffe0c2;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}

/* bintang */
.sp,.bs{position:absolute;width:var(--s,46px);height:var(--s,46px);background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 12px #fff);pointer-events:none}
.sp{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.55) rotate(25deg);opacity:.6}}
.bs{--s:22px;left:var(--x);top:var(--y);animation:burst .9s ease-out forwards;z-index:5}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}

/* hitung mundur + aksi */
.count{display:flex;justify-content:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.count div{min-width:76px;padding:12px 10px;border:1px solid var(--or2);border-radius:16px;background:rgba(255,122,0,.12);backdrop-filter:blur(4px)}
.count b{display:block;font:400 2rem "Archivo Black",sans-serif;color:#fff}
.count b.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:translateY(-5px) scale(1.12)}}
.count span{font-size:.78rem;color:#ffd9b8}
.acts{margin-top:10px}

/* konten */
.s{padding:68px 0}
.s h2{font:400 clamp(1.9rem,6vw,3rem)/1 "Archivo Black",Impact,sans-serif;text-transform:uppercase;margin:0 0 28px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.cards{display:grid;gap:16px}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.cd{padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(255,122,0,.16),rgba(255,122,0,.03));transition:transform .25s,border-color .25s}
.cd:hover{transform:translateY(-6px);border-color:var(--or2)}
.cd small{color:#ffe0c2;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.cd p{margin:6px 0 0;font:800 1.4rem/1.25 Poppins}
.cd span{color:#ffd9b8;font-size:.95rem}
.day{max-width:640px}
.day h3{margin:0 0 14px;font:800 1.15rem Poppins;color:#fff;padding:8px 16px;background:var(--or);border-radius:999px;display:inline-block}
.day ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--or)}
.day li{padding:0 0 12px 18px;position:relative}
.day li::before{content:"";position:absolute;left:-8px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--or2);transition:background .25s}
.day li>div{padding:10px 16px;border-radius:14px;transition:background .25s,transform .25s;cursor:default}
.day li:hover>div{background:rgba(255,122,0,.14);transform:translateX(6px)}
.day li:hover::before{background:var(--or)}
.day time{color:#ffe0c2;font-weight:600}
.day p{margin:0;color:#ffe9d6}
.btn{display:inline-block;margin:14px 8px 0 0;padding:14px 26px;border-radius:999px;font:600 1rem Poppins;text-decoration:none;color:#fff;background:var(--or);border:2px solid var(--or);cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{background:#ff8f26;transform:translateY(-2px)}
.btn.ghost{background:transparent;border-color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}

/* rsvp */
.rsvp{padding:38px 26px;border-radius:26px;background:linear-gradient(160deg,#ff7a00,#c44a00);color:#fff}
.rsvp h2{color:#fff}
.rsvp form{display:grid;gap:14px;max-width:480px}
.rsvp label.f{font-weight:600;font-size:.9rem}
.rsvp input[type=text],.rsvp textarea{display:block;width:100%;margin-top:6px;padding:13px 16px;border:0;border-radius:14px;font:400 1rem Poppins;color:#3a1500;background:#fff}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pills label{cursor:pointer}
.pills input{position:absolute;opacity:0}
.pills span{display:inline-block;padding:11px 20px;border:2px solid #fff;border-radius:999px;font-weight:600;transition:background .2s,color .2s}
.pills input:checked+span{background:#fff;color:#c44a00}
.pills input:focus-visible+span{outline:3px solid #fff;outline-offset:3px}
.rsvp .btn{background:#fff;color:#c44a00;border-color:#fff;margin:0}
.rsvp .btn.ghost{background:transparent;color:#fff}
.rsvp .row{display:flex;gap:10px;flex-wrap:wrap}
footer{padding:36px 0 56px;text-align:center;color:#ffd9b8;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);padding:12px 22px;border-radius:999px;background:#fff;color:#c44a00;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* glassmorphism */
.cd,.day,.rsvp,.count div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.cd:hover{border-color:rgba(255,255,255,.5)}
.day{padding:26px 24px 14px;border-radius:24px}
.rsvp{background:rgba(255,122,0,.26)}
.toast{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.92)}

/* muncul saat scroll */
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}
.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hero" id="hero">
  <i class="sp" style="top:6%;right:8%"></i>
  <i class="sp" style="top:30%;left:-14px;--s:60px;animation-delay:1s"></i>
  <i class="sp" style="bottom:12%;right:4%;--s:38px;animation-delay:.5s"></i>
  <div class="wrap">
    <div class="logo" id="logo"><img src="img/logo.png" alt="Logo" onerror="this.remove();document.getElementById('logo').append('ROTASI')"></div>
    <div class="tamu">Kepada Yth. <b id="tamu">Teman-teman</b></div>

    <div class="stage" id="stage">
      <div class="frame" id="frame" role="button" tabindex="0" aria-label="Ketuk untuk efek bintang">
        <div class="shot">
          <div class="pw">
            <div class="photo"><span class="ph">Taruh foto di img/foto.jpg</span><img src="img/foto.jpg" alt="Foto kebersamaan Rotasi" onerror="this.remove()"></div>
            <div class="bub w" id="bub1"></div>
            <div class="bub o"><span id="bub2a"></span><small id="bub2b"></small></div>
          </div>
          <h1 class="cap"><img src="img/judul.png" alt="Syukuran Rotasi XXXVI" onerror="this.replaceWith(document.createTextNode(CONFIG.acara))"></h1>
        </div>
      </div>
    </div>
    <p class="hint">Gerakkan kursor atau ketuk kartu di atas</p>

    <div class="count" id="count"></div>
    <div class="acts">
      <a class="btn" id="calBtn" target="_blank" rel="noopener">Tambah ke kalender</a>
      <button class="btn ghost" id="shareBtn" type="button">Bagikan undangan</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="s rv" id="info">
    <h2>Detail acara</h2>
    <div class="cards">
      <div class="cd"><small>Tanggal</small><p id="tgl"></p><span id="jam"></span></div>
      <div class="cd"><small>Lokasi</small><p id="tempat"></p><span id="alamat"></span><br>
        <a class="btn" id="maps" target="_blank" rel="noopener">Buka Google Maps</a></div>
    </div>
  </section>

  <section class="s rv" id="rundown">
    <h2>Rangkaian acara</h2>
    <div id="days"></div>
  </section>

  <section class="s rv" id="bawa">
    <h2>Perlu dibawa</h2>
    <p id="bawaTxt" style="max-width:60ch"></p>
  </section>

  <section class="s rv" id="rsvp">
    <div class="rsvp">
      <h2>Konfirmasi kehadiran</h2>
      <form id="rsvpForm">
        <label class="f">Nama<input type="text" id="fNama" required maxlength="60" placeholder="Nama kamu" autocomplete="name"></label>
        <div class="pills" role="radiogroup" aria-label="Kehadiran">
          <label><input type="radio" name="hadir" value="Hadir" checked><span>Hadir</span></label>
          <label><input type="radio" name="hadir" value="Belum bisa hadir"><span>Belum bisa hadir</span></label>
        </div>
        <label class="f">Pesan untuk panitia (opsional)<textarea id="fPesan" rows="2" maxlength="200"></textarea></label>
        <div class="row">
          <button class="btn" type="submit">Kirim lewat WhatsApp</button>
          <a class="btn ghost" id="rsvpLink" target="_blank" rel="noopener" hidden>Isi Google Form</a>
        </div>
      </form>
    </div>
  </section>
</main>

<footer>Sampai jumpa di <span id="foot"></span></footer>
<div class="toast" id="toast" role="status"></div>

<script>
document.documentElement.classList.add("js");
/* ====== UBAH DATA ACARA DI SINI SAJA ====== */
const CONFIG = {
  acara: "Syukuran Rotasi XXXVI",
  sapaan: "Kamu diundang!",
  mulai: "2026-11-07T08:00:00+08:00",       // jam mulai (WITA), dipakai hitung mundur
  selesai: "2026-11-08T12:00:00+08:00",     // untuk tombol kalender
  tanggalLabel: "7 – 8 November 2026",
  jamLabel: "Jam mulai: 08.00 WITA",
  tempat: "Pondok Uya, Pantai Anging Mamiri",
  alamat: "Lengkapi alamat di sini",
  mapsUrl: "https://www.google.com/maps/search/?api=1&query=Pondok+Uya+Pantai+Anging+Mamiri",
  rsvpUrl: "",                               // opsional: isi link Google Form, kosongkan kalau tidak dipakai
  waNomor: "6281234567890",                  // awali 62, tanpa + atau 0
  bawa: "Pakaian ganti, perlengkapan mandi, dan kabar baik. Detail lain akan diinfokan panitia.",
  rundown: [  // CONTOH, ganti sesuai rencana panitia
    { hari: "Sabtu, 7 Nov", item: [
      ["08.00", "Kumpul dan registrasi", "Ambil name tag dan cek kehadiran."],
      ["10.00", "Pembukaan", "Sambutan dan doa bersama."],
      ["19.00", "Malam kebersamaan", "Makan malam dan penampilan."] ] }
  ]
};
/* ========================================= */

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nama = (new URLSearchParams(location.search).get("to") || "").trim().slice(0, 60);
if (nama) { $("tamu").textContent = nama; $("fNama").value = nama; }

document.title = "Undangan " + CONFIG.acara;
$("bub1").textContent = CONFIG.sapaan;
$("bub2a").textContent = CONFIG.tanggalLabel;
$("bub2b").textContent = CONFIG.tempat;
$("tgl").textContent = CONFIG.tanggalLabel;
$("jam").textContent = CONFIG.jamLabel;
$("tempat").textContent = CONFIG.tempat;
$("alamat").textContent = CONFIG.alamat;
$("maps").href = CONFIG.mapsUrl;
$("bawaTxt").textContent = CONFIG.bawa;
$("foot").textContent = CONFIG.acara + ".";
if (CONFIG.rsvpUrl) { $("rsvpLink").href = CONFIG.rsvpUrl; $("rsvpLink").hidden = false; }

CONFIG.rundown.forEach(d => {
  const box = document.createElement("div"); box.className = "day";
  const h = document.createElement("h3"); h.textContent = d.hari;
  const ul = document.createElement("ul");
  d.item.forEach(([j, t, k]) => {
    const li = document.createElement("li"), w = document.createElement("div");
    const tm = document.createElement("time"), b = document.createElement("b"), p = document.createElement("p");
    tm.textContent = j + " WITA"; b.textContent = t; p.textContent = k;
    w.append(tm, document.createElement("br"), b, p); li.append(w); ul.appendChild(li);
  });
  box.append(h, ul); $("days").appendChild(box);
});

/* toast */
let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2400); }

/* hitung mundur (angka diperbarui, detik berdenyut) */
const target = new Date(CONFIG.mulai);
["hari","jam","menit","detik"].forEach(l => { const d=document.createElement("div"); d.innerHTML=`<b>0</b><span>${l}</span>`; $("count").appendChild(d); });
const nums = [...$("count").querySelectorAll("b")];
function tick(){
  const s = Math.max(0, Math.floor((target - new Date()) / 1000));
  [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60].forEach((n,i) => {
    if (nums[i].textContent != n) { nums[i].textContent = n; if (i===3 && !reduce){ nums[i].classList.remove("bump"); void nums[i].offsetWidth; nums[i].classList.add("bump"); } }
  });
}
tick(); setInterval(tick, 1000);

/* tambah ke kalender (Google Calendar) */
const f = d => new Date(d).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
$("calBtn").href = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(CONFIG.acara)
  + "&dates=" + f(CONFIG.mulai) + "/" + f(CONFIG.selesai)
  + "&location=" + encodeURIComponent(CONFIG.tempat) + "&details=" + encodeURIComponent("Undangan " + CONFIG.acara);

/* bagikan */
$("shareBtn").onclick = async () => {
  const data = { title: CONFIG.acara, text: "Kamu diundang ke " + CONFIG.acara, url: location.href.split("?")[0] };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast("Link undangan disalin"); } }
  catch (e) { if (e.name !== "AbortError") toast("Salin link dari kolom alamat browser"); }
};

/* cahaya mengikuti kursor + kartu miring 3D */
const hero = $("hero"), stage = $("stage"), frame = $("frame"), root = document.documentElement;
if (!reduce) {
  addEventListener("pointermove", e => { root.style.setProperty("--mx", e.clientX + "px"); root.style.setProperty("--my", e.clientY + "px"); });
  hero.addEventListener("pointermove", e => {
    const s = stage.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - s.left) / s.width)), y = Math.min(1, Math.max(0, (e.clientY - s.top) / s.height));
    frame.style.setProperty("--ry", ((x - .5) * 16) + "deg");
    frame.style.setProperty("--rx", (-(y - .5) * 12) + "deg");
  });
  hero.addEventListener("pointerleave", () => { frame.style.setProperty("--rx","0deg"); frame.style.setProperty("--ry","0deg"); });
}

/* ketuk kartu: semburan bintang */
function burst(cx, cy){
  const r = stage.getBoundingClientRect();
  for (let i = 0; i < 14; i++) {
    const b = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 110;
    b.className = "bs";
    b.style.cssText = `--x:${cx - r.left}px;--y:${cy - r.top}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    stage.appendChild(b); setTimeout(() => b.remove(), 950);
  }
}
frame.addEventListener("click", e => { if (!reduce) burst(e.clientX, e.clientY); });
frame.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); const r = frame.getBoundingClientRect(); if (!reduce) burst(r.left + r.width/2, r.top + r.height/2); } });

/* muncul saat di-scroll */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .15 }) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));

/* RSVP lewat WhatsApp */
$("rsvpForm").addEventListener("submit", e => {
  e.preventDefault();
  const st = document.querySelector("input[name=hadir]:checked").value, ps = $("fPesan").value.trim();
  const msg = `Halo panitia, saya ${$("fNama").value.trim()} konfirmasi: ${st} di ${CONFIG.acara} (${CONFIG.tanggalLabel}).` + (ps ? ` Pesan: ${ps}` : "");
  window.open("https://wa.me/" + CONFIG.waNomor + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
  toast("Membuka WhatsApp...");
});
</script>
</body>
</html>
